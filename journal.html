<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ Journal — BS 8110 Structural Design Guide</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="favicon.png">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
/* =====================================
   DESIGN TOKENS - Notion B&W (Matches main site)
   ===================================== */
:root {
  --black:      #0f0f0f;
  --off-black:  #1a1a1a;
  --dark-gray:  #2d2d2d;
  --mid-gray:   #6b6b6b;
  --rule:       #e0e0e0;
  --light-bg:   #f7f7f5;
  --white:      #ffffff;
  --highlight:  #f0f0ee;
  
  --accent:      #2f5d8a;
  --accent-dim:  #7996ab;
  --accent-bg:   #eef3f7;

  --mono:  'IBM Plex Mono', monospace;
  --serif: 'Lora', serif;
  --sans:  'Inter', sans-serif;

  --radius: 4px;
  --max-w:  760px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--white);
  color: var(--black);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 0 100px 0;
}

/* =====================================
   LAYOUT & CONTAINER
   ===================================== */
.container {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 24px;
}

/* =====================================
   HEADER (Simple Lesley.pizza style)
   ===================================== */
header {
  padding: 60px 0 30px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 40px;
  position: relative;
}
.back-btn {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--mid-gray);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 24px;
  transition: color 0.15s;
}
.back-btn:hover {
  color: var(--accent);
}
header h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 32px;
  line-height: 1.25;
  margin-bottom: 8px;
}
.header-sub {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--mid-gray);
  letter-spacing: 0.04em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* =====================================
   CMS CONFIG LINK (Gear icon)
   ===================================== */
.settings-trigger {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--mid-gray);
  display: inline-flex;
  align-items: center;
  transition: color 0.15s;
}
.settings-trigger:hover {
  color: var(--black);
}

/* =====================================
   SEARCH & FILTERS
   ===================================== */
.controls {
  margin-bottom: 30px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.search-wrapper {
  position: relative;
}
.search-input {
  width: 100%;
  padding: 12px 16px;
  font-size: 14.5px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-family: var(--sans);
  background: var(--light-bg);
  color: var(--black);
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
.search-input:focus {
  border-color: var(--accent);
  background: var(--white);
}
.tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-pill {
  font-family: var(--mono);
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--light-bg);
  border: 1px solid var(--rule);
  cursor: pointer;
  color: var(--dark-gray);
  transition: all 0.15s;
}
.tag-pill:hover {
  border-color: var(--black);
}
.tag-pill.active {
  background: var(--accent);
  color: var(--white);
  border-color: var(--accent);
}

/* =====================================
   JOURNAL CARDS
   ===================================== */
.journal-list {
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.journal-card {
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 24px;
  background: var(--white);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.journal-card:hover {
  border-color: var(--accent-dim);
  box-shadow: 0 4px 12px rgba(47,93,138,0.06);
}
.card-meta {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--mid-gray);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.card-meta .card-date {
  color: var(--mid-gray);
}
.card-tags {
  display: flex;
  gap: 6px;
}
.card-tag {
  color: var(--accent);
}
.journal-card h2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 19px;
  margin-bottom: 12px;
  line-height: 1.35;
}
.card-answer {
  font-size: 14.5px;
  color: var(--dark-gray);
  line-height: 1.7;
}
.card-answer p {
  margin-bottom: 12px;
}
.card-answer p:last-child {
  margin-bottom: 0;
}
.card-answer ul {
  padding-left: 20px;
  margin-bottom: 12px;
}
.card-answer li {
  margin-bottom: 6px;
}
.card-answer strong {
  color: var(--black);
}
mark {
  background: var(--accent-bg);
  color: var(--accent);
  padding: 0 2px;
  border-radius: 2px;
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 60px 0;
  color: var(--mid-gray);
}
.empty-state h3 {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 400;
  margin-bottom: 8px;
  color: var(--black);
}

/* =====================================
   SETTINGS DIALOG / MODAL
   ===================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(2px);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-overlay.visible {
  display: flex;
}
.modal-card {
  background: var(--white);
  border: 1px solid var(--black);
  border-radius: var(--radius);
  width: 100%;
  max-width: 480px;
  padding: 28px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.modal-card h3 {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 400;
  margin-bottom: 14px;
}
.modal-card p {
  font-size: 13.5px;
  color: var(--mid-gray);
  margin-bottom: 18px;

}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  font-family: var(--mono);
  font-size: 10.5px;
  text-transform: uppercase;
  color: var(--black);
  display: block;
  margin-bottom: 6px;
  font-weight: 600;
}
.form-group input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-family: var(--sans);
  outline: none;
  font-size: 13.5px;
}
.form-group input:focus {
  border-color: var(--accent);
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}
.btn {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 8px 16px;
  border-radius: var(--radius);
  cursor: pointer;
  border: 1px solid var(--rule);
  background: var(--white);
  transition: all 0.15s;
}
.btn:hover {
  border-color: var(--black);
}
.btn-primary {
  background: var(--black);
  color: var(--white);
  border-color: var(--black);
}
.btn-primary:hover {
  background: var(--dark-gray);
}
</style>

<div class="container">
  
  <!-- Header -->
  <header>
    <a href="index.html" class="back-btn">&larr; Back to Manual Design Guide</a>

    <div class="header-sub">

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal" onclick="closeSettingsFromOverlay(event)">
  <div class="modal-card">
    <h3>No-Code CMS Settings</h3>
    <p>By default, this journal loads pre-populated FAQs. You can connect it to your own published Google Sheet to easily add/edit articles without coding.</p>
    
    <div class="form-group">
      <label for="sheetUrlInput">Google Sheet Published CSV URL</label>
      <input type="text" id="sheetUrlInput" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv">
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeSettings()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save &amp; Sync</button>
    </div>

<script>
// =====================================
// DEFAULT DATA STORE (Fallback)
// =====================================
const defaultFAQs = [
  {
    title: "If a wall sits directly on a slab (not on a beam), how does the slab 'see' that load?",
    date: "July 22, 2026",
    tags: ["Slabs", "Loading"],
    answer: `<p>If a partition wall runs across a slab panel, it cannot be treated as a simple UDL. How it behaves depends on its orientation and weight:</p>
             <ul>
               <li><strong>Lightweight partitions (e.g., stud walls, drywall):</strong> BS 8110 and BS 6399-1 allow these to be represented by a uniform UDL allowance of <strong>1.0 kN/m²</strong> added directly to the slab dead load. This is a common design office shortcut.</li>
               <li><strong>Heavy masonry walls (e.g., 9-inch sandcrete block walls):</strong> These must be treated as concentrated <strong>line loads</strong>. The bending moments are calculated using yield line methods, or by distributing the wall weight over a tributary strip of slab (often taken as a width of <em>b_w + 2h_slab</em> or using a 45° load dispersion angle).</li>
             </ul>`
  },
  {
    title: "Do you always need to check a slab for punching shear, or only flat slabs?",
    date: "July 22, 2026",
    tags: ["Slabs", "Shear"],
    answer: `<p>Punching shear occurs when a concentrated load or column reaction acts on a relatively thin slab, creating a truncated cone of failure. While it is the primary governing design case for <strong>flat slabs</strong> (which sit directly on columns without beams, Cl. 3.7.7), you must also check it in:</p>
             <ul>
               <li>Standard slabs where a heavy column or point load lands directly on the slab (e.g., a transfer column situation).</li>
               <li>Foundation pad footings (which are effectively inverted slabs loaded by column reactions).</li>
             </ul>
             <p>For standard beam-and-slab layouts, beam supports distribute the load linearly into the beams, so only standard beam shear (Cl. 3.5.4) is checked.</p>`
  },
  {
    title: "If two beams intersect at right angles at midspan (not at a column), how do you handle the load transfer?",
    date: "July 22, 2026",
    tags: ["Beams", "Loading"],
    answer: `<p>This is a secondary-to-primary beam intersection. The secondary beam transfers its end reaction as a concentrated <strong>point load</strong> onto the primary beam. The primary beam must be designed for this point load at midspan (creating a peak bending moment of <em>PL / 4</em> at that location, rather than UDL's <em>wL² / 8</em>).</p>
             <p><strong>Critical Detail:</strong> You must provide hanger/suspension reinforcement (links) at the intersection to "lift" the reaction from the bottom of the secondary beam into the top of the primary beam to prevent diagonal splitting failure.</p>`
  },
  {
    title: "Does a slab's live load (Q_k) ever get reduced, the way column live load is?",
    date: "July 22, 2026",
    tags: ["Slabs", "Loading"],
    answer: `<p>No. Slab panels are designed for the full characteristic imposed load (Q_k) from BS 6399-1 without reductions. This is because a single slab panel can easily be fully loaded by crowds, furniture, or equipment.</p>
             <p>Live load reductions (BS 6399-1 Cl. 6) are statistical reductions applied only to columns, walls, and foundations that support large cumulative areas across multiple floors, as it is highly improbable that all floors will be fully loaded at the same time.</p>`
  },
  {
    title: "If a column is bigger at the bottom of the building than the top, does that count as 'slender' differently at each level?",
    date: "July 22, 2026",
    tags: ["Columns", "Slenderness"],
    answer: `<p>Yes, slenderness (l_e / h) is a floor-by-floor property, not a global building property. At each floor level, you compute l_e / h about both axes using the column's clear height (l_clear) and section dimension (h or b) at <em>that</em> specific storey.</p>
             <p>A column might be classified as "short" at the ground floor (due to a large cross-section or short floor height) but "slender" at upper storeys where the section is reduced or the floor height is taller.</p>`
  },
  {
    title: "Why does a cantilever need such a conservative span/depth ratio (7, versus 20 for simply supported)?",
    date: "July 22, 2026",
    tags: ["Beams", "Slabs", "Deflection"],
    answer: `<p>Cantilevers are highly sensitive to deflection. Unlike a simply supported beam which bends in a symmetric curve supported at both ends, a cantilever has maximum rotation at the free end.</p>
             <p>The deflection of a cantilever under a UDL is <em>wL⁴ / (8EI)</em>, compared to <em>5wL⁴ / (384EI)</em> for simply supported &mdash; which is <strong>9.6 times larger</strong> for the same span and load! To prevent excessive sag and rotation, the span-to-depth ratio is capped at 7.</p>`
  },
  {
    title: "Does the choice of f_cu (concrete grade) change how you calculate loads, or only how you design the section?",
    date: "July 22, 2026",
    tags: ["Materials", "Loading"],
    answer: `<p>Primarily, f_cu governs the design capacity of the cross-section (flexural compression, shear capacity v_c, column axial strength). However, concrete grade does indirectly affect the self-weight loading because higher grades might allow for thinner/smaller members, reducing the dead load (G_k).</p>
             <p>Note: The unit weight of reinforced concrete is typically assumed constant at <strong>24 kN/m³</strong> regardless of the strength grade.</p>`
  },
  {
    title: "If a beam has different reinforcement top and bottom at midspan, does that mean it's doubly reinforced?",
    date: "July 22, 2026",
    tags: ["Beams"],
    answer: `<p>No. A beam is only "doubly reinforced" if compression steel is <em>actively</em> required to carry the bending moment because the applied moment factor exceeds the singly reinforced limit (K > K' where K' = 0.156).</p>
             <p>Almost all beams have top steel at midspan for other reasons (e.g., hanger bars to support shear links, or anchorage continuity). If this top steel is not needed to resist compression block stress, the beam is designed as singly reinforced.</p>`
  },
  {
    title: "Do you need to check deflection separately for a slab if you've already checked it for the beam supporting it?",
    date: "July 22, 2026",
    tags: ["Slabs", "Beams", "Deflection"],
    answer: `<p>Yes. Slabs and beams deflect relative to different boundaries. The beam deflections are relative to the columns, while slab deflections are relative to the beams. The total deflection seen by partitions on the slab is the cumulative sum of both.</p>
             <p>Therefore, you must satisfy the basic span/d ratios for the slab separately from the beam.</p>`
  }
];

// =====================================
// STATE & SEARCH
// =====================================
let currentArticles = [];
let selectedTag = "";

window.addEventListener('DOMContentLoaded', async () => {
  // Load settings
  const savedUrl = localStorage.getItem('sheet_csv_url');
  if (savedUrl) {
    document.getElementById('sheetUrlInput').value = savedUrl;
    await fetchFromSheet(savedUrl);
  } else {
    currentArticles = [...defaultFAQs];
    renderJournal();
  }
  populateTags();
});

// =====================================
// GOOGLE SHEETS SYNC
// =====================================
async function fetchFromSheet(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Network response was not ok');
    const csvText = await res.text();
    
    // Parse CSV to JSON
    const rows = csvText.split('\n').map(row => {
      // Basic CSV splitter
      return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
    });

    if (rows.length < 2) {
      currentArticles = [...defaultFAQs];
      return;
    }

    const headers = rows[0];
    const parsed = [];
    for (let i = 1; i < rows.length; i++) {
      if (rows[i].length < headers.length || !rows[i][0]) continue;
      const item = {};
      headers.forEach((header, index) => {
        const cleanHeader = header.toLowerCase().trim();
        item[cleanHeader] = rows[i][index];
      });
      
      // Parse tags
      const rawTags = item.tags || '';
      item.tags = rawTags.split(';').map(t => t.trim()).filter(t => t);
      
      // Format answer from markdown-like/plaintext to HTML
      let rawAnswer = item.answer || '';
      if (!rawAnswer.startsWith('<')) {
        // Convert double newlines to paragraphs
        rawAnswer = rawAnswer.split('\n\n').map(p => `<p>${p}</p>`).join('');
      }
      item.answer = rawAnswer;
      item.title = item.title || item.question;
      item.date = item.date || 'Sync Date';
      parsed.push(item);
    }
    
    currentArticles = parsed;
    renderJournal();
  } catch (err) {
    console.error('Failed to fetch from sheet, using defaults:', err);
    currentArticles = [...defaultFAQs];
    renderJournal();
  }
}

// =====================================
// RENDER & FILTER
// =====================================
function populateTags() {
  const tags = new Set();
  defaultFAQs.forEach(art => art.tags.forEach(t => tags.add(t)));
  const tagList = document.getElementById('tagList');
  tagList.innerHTML = '';
  
  // All tag
  const allPill = document.createElement('button');
  allPill.className = 'tag-pill ' + (!selectedTag ? 'active' : '');
  allPill.innerText = 'All Topics';
  allPill.onclick = () => filterByTag('');
  tagList.appendChild(allPill);

  Array.from(tags).sort().forEach(tag => {
    const pill = document.createElement('button');
    pill.className = 'tag-pill ' + (selectedTag === tag ? 'active' : '');
    pill.innerText = `#${tag.toLowerCase()}`;
    pill.onclick = () => filterByTag(tag);
    tagList.appendChild(pill);
  });
}

function filterByTag(tag) {
  selectedTag = tag;
  populateTags();
  handleSearch();
}

function renderJournal(articles = currentArticles) {
  const container = document.getElementById('journalList');
  container.innerHTML = '';

  if (articles.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <h3>No entries found</h3>
        <p>Try searching for different terms or reset your filters.</p>
      </div>
    `;
    return;
  }

  articles.forEach(art => {
    const card = document.createElement('article');
    card.className = 'journal-card';
    
    const tagElements = art.tags.map(t => `<span class="card-tag">#${t.toLowerCase()}</span>`).join(' ');
    
    card.innerHTML = `
      <div class="card-meta">
        <span class="card-date">${art.date}</span>
        <div class="card-tags">${tagElements}</div>
      </div>
      <h2>${art.title}</h2>
      <div class="card-answer">${art.answer}</div>
    `;
    container.appendChild(card);
  });
}

// =====================================
// INTELLIGENT SEARCH (Google-like with highlighting)
// =====================================
function handleSearch() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  
  let filtered = currentArticles;

  // 1. Tag filter
  if (selectedTag) {
    filtered = filtered.filter(art => art.tags.includes(selectedTag));
  }

  // 2. Intelligent query filter
  if (query) {
    const terms = query.split(/\s+/);
    filtered = filtered.filter(art => {
      // Check if all search terms are found in title, content, or tags
      return terms.every(term => {
        return art.title.toLowerCase().includes(term) ||
               art.answer.toLowerCase().includes(term) ||
               art.tags.some(t => t.toLowerCase().includes(term));
      });
    });

    // 3. Matched text highlighting
    filtered = filtered.map(art => {
      let highlightedTitle = art.title;
      let highlightedAnswer = art.answer;

      terms.forEach(term => {
        if (term.length < 2) return; // avoid highlighting single letters
        const regex = new RegExp(`(${escapeRegExp(term)})`, 'gi');
        
        // Highlight title
        highlightedTitle = highlightedTitle.replace(regex, '<mark>$1</mark>');
        
        // Highlight answer (avoiding HTML tag attributes)
        highlightedAnswer = highlightTextSafe(highlightedAnswer, term);
      });

      return {
        ...art,
        title: highlightedTitle,
        answer: highlightedAnswer
      };
    });
  }

  renderJournal(filtered);
}

function escapeRegExp(string) {
  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Safely highlight text inside HTML without breaking tags
function highlightTextSafe(html, term) {
  const regex = new RegExp(`(${escapeRegExp(term)})`, 'gi');
  // Temporary place to store tag tokens
  const tags = [];
  // Replace tags with placeholders
  let text = html.replace(/(<[^>]+>)/g, (match) => {
    tags.push(match);
    return `___TAG_PLACEHOLDER_${tags.length - 1}___`;
  });
  // Replace terms
  text = text.replace(regex, '<mark>$1</mark>');
  // Restore tags
  return text.replace(/___TAG_PLACEHOLDER_(\d+)___/g, (match, index) => {
    return tags[parseInt(index, 10)];
  });
}

// =====================================
// MODAL CONTROLS
// =====================================
function openSettings() {
  document.getElementById('settingsModal').classList.add('visible');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('visible');
}

function closeSettingsFromOverlay(e) {
  if (e.target.id === 'settingsModal') {
    closeSettings();
  }
}

async function saveSettings() {
  const url = document.getElementById('sheetUrlInput').value.trim();
  if (url) {
    localStorage.setItem('sheet_csv_url', url);
    await fetchFromSheet(url);
  } else {
    localStorage.removeItem('sheet_csv_url');
    currentArticles = [...defaultFAQs];
    renderJournal();
  }
  closeSettings();
  populateTags();
}
</script>
